<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pos venta El Cholo - POS Profesional</title>
    <!-- Google Fonts: Outfit for titles, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #131a26;
            --bg-tertiary: #1b2537;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #6366f1;
            /* Indigo */
            --accent-hover: #4f46e5;
            --success: #10b981;
            /* Emerald */
            --success-hover: #059669;
            --warning: #f59e0b;
            /* Amber */
            --danger: #ef4444;
            /* Rose */
            --danger-hover: #dc2626;
            --border-color: #2e3c51;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Encabezado */
        header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, #151e2e 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-svg {
            width: 48px;
            height: 48px;
            background: rgba(99, 102, 241, 0.15);
            border: 2px solid var(--accent-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.25);
        }

        .header-text h1 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #ffffff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-text p {
            margin: 2px 0 0 0;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .clock {
            font-family: 'Outfit', monospace;
            font-size: 1rem;
            color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.08);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            font-weight: 600;
        }

        #contenedor {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        /* Lado Izquierdo: Ventas y Búsqueda */
        #ventas {
            flex: 2;
            background: var(--bg-secondary);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .search-container {
            position: relative;
            margin-bottom: 5px;
        }

        input#codigo {
            width: 100%;
            padding: 16px 16px 16px 48px;
            font-size: 1.25rem;
            font-family: 'Inter', sans-serif;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
        }

        input#codigo:focus,
        input#cantidad-agregar:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            transition: var(--transition);
        }

        input#codigo:focus+.search-icon {
            color: var(--accent-primary);
        }

        /* Sugerencias de búsqueda manual */
        .sugerencias-container {
            background: var(--bg-tertiary);
            border-radius: 0 0 12px 12px;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-top: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            display: none;
        }

        .sugerencias-container.active {
            display: block;
        }

        .sugerencia-item {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            color: var(--text-primary);
            transition: var(--transition);
        }

        .sugerencia-item:last-child {
            border-bottom: none;
        }

        .sugerencia-item:hover {
            background: rgba(99, 102, 241, 0.15);
        }

        .sugerencia-thumb {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            flex-shrink: 0;
        }

        .sugerencia-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            gap: 2px;
        }

        .sugerencia-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sugerencia-code {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .sugerencia-price {
            color: var(--warning);
            font-weight: 700;
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            flex-shrink: 0;
        }

        .cart-item-thumb {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            flex-shrink: 0;
            margin-right: 12px;
        }

        #lista-productos {
            flex: 1;
            overflow-y: auto;
            margin-top: 15px;
            border-radius: 8px;
        }

        .producto-fila {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding: 16px 12px;
            align-items: center;
            font-size: 1.05rem;
            transition: var(--transition);
        }

        .producto-fila:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .prod-info {
            flex: 2;
        }

        .prod-info strong {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .prod-info small {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 4px;
            display: inline-block;
        }

        .prod-subtotal {
            font-weight: 700;
            color: var(--text-primary);
            margin-right: 20px;
            font-size: 1.1rem;
        }

        /* Lado Derecho: Totales */
        #totales {
            flex: 1;
            background: var(--bg-secondary);
            padding: 28px;
            border-radius: 16px;
            border: 2px solid var(--accent-primary);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            overflow-y: auto;
        }

        .total-header {
            text-align: center;
        }

        .total-header h2 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .total-nro {
            font-family: 'Outfit', sans-serif;
            font-size: 3.2rem;
            color: var(--success);
            font-weight: 800;
            text-align: center;
            margin: 12px 0;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
        }

        .payment-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            padding: 14px;
            font-size: 1rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            width: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-weight: 500;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }

        select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .caja-vuelto {
            background: rgba(245, 158, 11, 0.05);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(245, 158, 11, 0.2);
            margin-top: 4px;
        }

        .caja-vuelto input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            font-size: 1.1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-weight: 600;
            box-sizing: border-box;
            outline: none;
            transition: var(--transition);
        }

        .caja-vuelto input:focus {
            border-color: var(--warning);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .vuelto-text {
            margin: 12px 0 0 0;
            font-size: 1.25rem;
            text-align: center;
            font-weight: 600;
        }

        #vuelto-display {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
        }

        .btn {
            font-family: 'Outfit', sans-serif;
            border: none;
            padding: 16px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 10px;
            width: 100%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-finalizar {
            background: var(--success);
            color: #ffffff;
            margin-top: 10px;
        }

        .btn-finalizar:hover {
            background: var(--success-hover);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        .btn-fiado {
            background: var(--accent-primary);
            color: white;
        }

        .btn-fiado:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        .btn-cancelar {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 10px;
            font-size: 0.95rem;
        }

        .btn-cancelar:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .btn-eliminar {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: var(--transition);
        }

        .btn-eliminar:hover {
            background: var(--danger);
            color: white;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--text-secondary);
            text-decoration: underline;
            cursor: pointer;
            margin-top: 10px;
            font-size: 0.9rem;
            width: 100%;
            transition: var(--transition);
            font-weight: 500;
        }

        .btn-link:hover {
            color: var(--accent-primary);
        }

        /* Responsivo */
        @media (max-width: 900px) {
            #contenedor {
                flex-direction: column;
                overflow-y: auto;
            }

            #ventas,
            #totales {
                flex: none;
                height: auto;
            }

            body {
                overflow-y: auto;
            }
        }

        /* Modal Catálogo */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 23, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 94%;
            max-width: 1060px;
            height: 88vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: slideUp 0.2s ease-out;
            overflow: hidden;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(19, 26, 38, 0.95);
        }

        .modal-header h3 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            color: var(--warning);
            font-size: 1.35rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.8rem;
            cursor: pointer;
            transition: var(--transition);
            line-height: 1;
            padding: 4px;
            border-radius: 8px;
        }

        .modal-close:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        .modal-body {
            padding: 18px 22px 22px 22px;
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Categorías en Modal (Wrap limpio sin barra de scroll) */
        .catalogo-categorias {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            padding: 2px 0 4px 0;
            overflow: visible;
        }

        .catalogo-cat-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }

        .catalogo-cat-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.12);
            transform: translateY(-1px);
        }

        .catalogo-cat-btn.active {
            background: var(--accent-primary);
            color: #ffffff;
            border-color: var(--accent-primary);
            box-shadow: 0 3px 12px rgba(99, 102, 241, 0.4);
            font-weight: 700;
        }

        .grid-catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 16px;
            align-content: start;
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            padding: 4px 6px 20px 2px;
        }

        .grid-catalogo::-webkit-scrollbar {
            width: 6px;
        }

        .grid-catalogo::-webkit-scrollbar-track {
            background: transparent;
        }

        .grid-catalogo::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .grid-catalogo::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }

        /* Tarjeta de Producto POS Táctil */
        .tarjeta-producto {
            background: var(--bg-secondary);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            display: flex;
            flex-direction: column;
            height: 255px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
            position: relative;
            user-select: none;
        }

        .tarjeta-producto:hover {
            border-color: var(--accent-primary);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .tarjeta-producto:active {
            transform: scale(0.97);
        }

        /* Foto amplia y limpia (sin nada tapándola) */
        .tarjeta-producto-thumb {
            position: relative;
            width: 100%;
            height: 148px;
            background: #0b0f17;
            overflow: hidden;
            flex-shrink: 0;
        }

        .tarjeta-producto-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
            display: block;
        }

        .tarjeta-producto:hover .tarjeta-producto-img {
            transform: scale(1.08);
        }

        /* Cuerpo del producto: nombre y precio */
        .tarjeta-producto-body {
            padding: 12px 14px 14px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            background: var(--bg-secondary);
        }

        .tarjeta-producto-titulo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin: 0;
        }

        .tarjeta-producto-footer {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: auto;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .tarjeta-producto-precio {
            color: var(--warning);
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            letter-spacing: -0.3px;
        }

        .tarjeta-producto-codigo {
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .stock-bajo {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }

        /* =========================================================
           MODAL COMPROBANTE POS & TICKET (VISTA PANTALLA)
           ========================================================= */
        #modal-ticket-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            animation: fadeInModal 0.2s ease-out;
        }

        @keyframes fadeInModal {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        #modal-ticket-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
            max-width: 440px;
            width: 100%;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-ticket-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(99, 102, 241, 0.08);
        }

        .modal-ticket-header h3 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            color: var(--text-primary);
        }

        .btn-close-modal {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: var(--transition);
        }

        .btn-close-modal:hover {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .ticket-paper-container {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .ticket-paper {
            background: #ffffff;
            color: #111827;
            font-family: 'Courier New', Courier, monospace;
            width: 100%;
            max-width: 340px;
            padding: 24px 20px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            font-size: 0.88rem;
            line-height: 1.4;
            box-sizing: border-box;
        }

        .ticket-header {
            text-align: center;
            margin-bottom: 12px;
        }

        .ticket-brand {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            color: #000000;
        }

        .ticket-subtitle {
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 2px;
            color: #374151;
        }

        .ticket-meta {
            font-size: 0.78rem;
            margin-top: 8px;
            color: #4b5563;
        }

        .ticket-divider {
            border-top: 1px dashed #6b7280;
            margin: 12px 0;
        }

        .ticket-col-headers {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.78rem;
            color: #1f2937;
            margin-bottom: 6px;
        }

        .ticket-row-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: 6px;
        }

        .ticket-item-left {
            flex: 1;
            padding-right: 8px;
        }

        .ticket-item-qty {
            font-weight: 700;
            color: #000000;
        }

        .ticket-item-name {
            font-weight: 600;
            color: #111827;
        }

        .ticket-item-sub {
            font-size: 0.75rem;
            color: #4b5563;
            margin-left: 20px;
        }

        .ticket-item-right {
            font-weight: 700;
            color: #000000;
            white-space: nowrap;
        }

        .ticket-totals {
            margin-top: 10px;
        }

        .ticket-total-row {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            font-size: 0.86rem;
        }

        .ticket-total-row.main-total {
            font-size: 1.08rem;
            font-weight: 800;
            color: #000000;
            margin-bottom: 8px;
        }

        .ticket-footer {
            text-align: center;
            margin-top: 14px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .ticket-footer-sub {
            font-weight: 400;
            font-size: 0.75rem;
            color: #4b5563;
            margin-top: 3px;
        }

        .modal-actions {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            background: var(--bg-tertiary);
        }

        .btn-print-ticket {
            background: var(--accent-primary);
            color: #ffffff;
            flex: 1;
        }

        .btn-print-ticket:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.35);
        }

        .btn-close-ticket {
            background: var(--success);
            color: #ffffff;
            flex: 1;
        }

        .btn-close-ticket:hover {
            background: var(--success-hover);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.35);
        }

        .btn-ver-ticket {
            background: rgba(99, 102, 241, 0.12);
            color: var(--accent-primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
            font-size: 0.95rem;
            padding: 13px;
            margin-top: 4px;
        }

        .btn-ver-ticket:hover {
            background: var(--accent-primary);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        /* =========================================================
           IMPRESIÓN TÉRMICA PERFECTA (80mm / 58mm) @media print
           ========================================================= */
        @media print {
            body * {
                visibility: hidden !important;
            }
            body {
                background: #ffffff !important;
                color: #000000 !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
            }
            #modal-ticket-overlay,
            #modal-ticket-box,
            .ticket-paper-container,
            #ticket-paper,
            #ticket-paper * {
                visibility: visible !important;
            }
            #modal-ticket-overlay {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                height: auto !important;
                background: transparent !important;
                backdrop-filter: none !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
            }
            #modal-ticket-box {
                position: static !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                background: transparent !important;
                border: none !important;
                box-shadow: none !important;
            }
            .no-print {
                display: none !important;
            }
            .ticket-paper-container {
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
            }
            #ticket-paper {
                width: 100% !important;
                max-width: 76mm !important;
                margin: 0 !important;
                padding: 3mm 1mm !important;
                background: #ffffff !important;
                color: #000000 !important;
                font-family: 'Courier New', Courier, monospace !important;
                font-size: 11.5px !important;
                line-height: 1.35 !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
            }
            @page {
                margin: 0;
                size: auto;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-left">
            <div class="logo-svg">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                    <path d="M3 6h18" />
                    <path d="M16 10a4 4 0 0 1-8 0" />
                </svg>
            </div>
            <div class="header-text">
                <h1>PUNTO DE VENTA</h1>
                <p>Sistema de Gestión de Ventas & POS</p>
            </div>
        </div>
        <div class="header-right">
            <div id="reloj" class="clock">00:00:00</div>
        </div>
    </header>

    <div id="contenedor">
        <!-- SECCIÓN IZQUIERDA: CARGA DE PRODUCTOS -->
        <div id="ventas">
            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <div style="display: flex; flex-direction: column; gap: 6px; width: 110px; flex-shrink: 0;"
                    title="Cantidad de productos a agregar">
                    <input type="number" id="cantidad-agregar" min="1" value="1"
                        style="padding: 16px; font-size: 1.25rem; font-family: 'Inter', sans-serif; border: 2px solid var(--border-color); border-radius: 12px; background: var(--bg-primary); color: var(--text-primary); text-align: center; font-weight: 700; outline: none; box-sizing: border-box; transition: var(--transition);"
                        onfocus="this.select()">
                </div>
                <div class="search-container" style="flex: 1; margin-bottom: 0;">
                    <input type="text" id="codigo" placeholder="Escaneá código de barras o escribí nombre..." autofocus
                        autocomplete="off">
                    <div class="search-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- BOTÓN VER TODOS LOS PRODUCTOS -->
            <button id="btn-ver-catalogo" onclick="abrirModalCatalogo()"
                style="margin-bottom: 15px; background: var(--bg-tertiary); color: var(--warning); border: 1px solid var(--border-color); padding: 14px; font-size: 1.05rem; font-family: 'Outfit', sans-serif; font-weight: 600; border-radius: 12px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition);">
                📖 VER TODOS LOS PRODUCTOS / CATÁLOGO
            </button>

            <!-- Sugerencias de búsqueda manual -->
            <div id="lista-sugerencias" class="sugerencias-container"></div>

            <div id="lista-productos">
                <p
                    style="color: var(--text-secondary); text-align: center; margin-top: 60px; font-style: italic; font-size: 1.1rem;">
                    Esperando lectura de código o entrada de producto...
                </p>
            </div>
        </div>

        <!-- SECCIÓN DERECHA: COBRO Y TOTALES -->
        <div id="totales">
            <div class="total-header">
                <h2>Total a Cobrar</h2>
                <div class="total-nro" id="total-display">$0,00</div>
            </div>

            <div class="payment-section">
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label>Medio de Pago</label>
                    <select id="metodo-pago">
                        <option value="efectivo">💵 Efectivo</option>
                        <option value="debito">💳 Débito / Crédito</option>
                        <option value="qr">📱 Mercado Pago / QR</option>
                    </select>
                </div>

                <div class="caja-vuelto">
                    <label>💰 Paga con</label>
                    <input type="number" id="paga-con" oninput="calcularVuelto()" placeholder="Ej: 5000">
                    <p class="vuelto-text">
                        Vuelto: <span id="vuelto-display" style="color: var(--text-primary);">$0,00</span>
                    </p>
                </div>

                <button class="btn btn-finalizar" onclick="finalizarVenta()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6 9 17l-5-5" />
                    </svg>
                    FINALIZAR VENTA
                </button>

                <button class="btn btn-fiado" onclick="enviarAFiado()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                    </svg>
                    ANOTAR EN FIADOS
                </button>

                <button class="btn btn-ver-ticket" onclick="reimprimirUltimoTicket()" title="Ver y reimprimir el ticket de la última venta">
                    🧾 Reimprimir Último Ticket
                </button>

                <button class="btn btn-cancelar" onclick="cancelarCarrito()">
                    🚫 Cancelar Carrito
                </button>

                <button onclick="window.location.href='admin.html'" class="btn-link">
                    ⚙️ Ir a Panel de Administración
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DE CATÁLOGO DE PRODUCTOS -->
    <div id="modal-catalogo" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📖 Catálogo de Productos</h3>
                <button class="modal-close" onclick="cerrarModalCatalogo()">×</button>
            </div>
            <div class="modal-body">
                <div class="search-container" style="margin-bottom: 12px; position: relative;">
                    <input type="text" id="filtro-catalogo" placeholder="Buscar por nombre o código..."
                        oninput="filtrarCatalogo()"
                        style="width: 100%; padding: 12px 12px 12px 42px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: 10px; background: var(--bg-primary); color: var(--text-primary); outline: none;">
                    <div class="search-icon"
                        style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                    </div>
                </div>

                <!-- CATEGORIAS PILLS -->
                <div class="catalogo-categorias" id="catalogo-categorias">
                    <!-- Se llena dinámicamente -->
                </div>

                <div class="grid-catalogo" id="grid-catalogo-productos">
                    <!-- Se llena dinámicamente con fotos -->
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL COMPROBANTE / TICKET POS -->
    <div id="modal-ticket-overlay" class="modal-overlay" style="display: none;">
        <div id="modal-ticket-box" class="modal-box">
            <div class="modal-ticket-header no-print">
                <h3>🧾 Comprobante de Venta POS</h3>
                <button class="btn-close-modal" onclick="cerrarModalTicket()" title="Cerrar (Esc)">✕</button>
            </div>
            
            <div class="ticket-paper-container">
                <div id="ticket-paper" class="ticket-paper"></div>
            </div>

            <div id="modal-ticket-actions" class="modal-actions no-print">
                <button class="btn btn-print-ticket" onclick="imprimirTicketActual()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 6 2 18 2 18 9"/>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                        <rect width="12" height="8" x="6" y="14"/>
                    </svg>
                    IMPRIMIR TICKET
                </button>
                <button class="btn btn-close-ticket" onclick="cerrarModalTicket()">
                    ✅ NUEVA VENTA
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Reloj digital en la cabecera
        function actualizarReloj() {
            const ahora = new Date();
            const hrs = String(ahora.getHours()).padStart(2, '0');
            const mins = String(ahora.getMinutes()).padStart(2, '0');
            const segs = String(ahora.getSeconds()).padStart(2, '0');
            document.getElementById('reloj').innerText = `${hrs}:${mins}:${segs}`;
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();
        // Las funciones resolverRutaImagen, handleImageFallback y PLACEHOLDER_IMG ya vienen provistas por script.js

        let catalogoCategoriaActiva = 'TODOS';

        function renderizarCategoriasCatalogo() {
            const container = document.getElementById('catalogo-categorias');
            if (!container) return;

            const categoriasSet = new Set();
            productosDB.forEach(p => {
                if (p.categoria && p.categoria.trim()) {
                    categoriasSet.add(p.categoria.trim());
                }
            });

            const categorias = Array.from(categoriasSet);
            let html = `
                <button class="catalogo-cat-btn ${catalogoCategoriaActiva === 'TODOS' ? 'active' : ''}" 
                        onclick="cambiarCategoriaCatalogo('TODOS')">
                    🍽️ Todos (${productosDB.length})
                </button>
            `;

            categorias.forEach(cat => {
                const count = productosDB.filter(p => p.categoria === cat).length;
                const isActive = catalogoCategoriaActiva === cat;
                html += `
                    <button class="catalogo-cat-btn ${isActive ? 'active' : ''}" 
                            onclick="cambiarCategoriaCatalogo('${cat.replace(/'/g, "\\'")}')">
                        ${cat} (${count})
                    </button>
                `;
            });

            container.innerHTML = html;
        }

        function cambiarCategoriaCatalogo(cat) {
            catalogoCategoriaActiva = cat;
            renderizarCategoriasCatalogo();
            renderizarCatalogo();
        }

        // Funciones del Catálogo Modal
        function abrirModalCatalogo() {
            document.getElementById('modal-catalogo').style.display = 'flex';
            document.getElementById('filtro-catalogo').value = '';
            catalogoCategoriaActiva = 'TODOS';
            renderizarCategoriasCatalogo();
            renderizarCatalogo();
            setTimeout(() => {
                const input = document.getElementById('filtro-catalogo');
                if (input) input.focus();
            }, 50);
        }

        function cerrarModalCatalogo() {
            document.getElementById('modal-catalogo').style.display = 'none';
            const input = document.getElementById('codigo');
            if (input) input.focus();
        }

        function renderizarCatalogo() {
            const grid = document.getElementById('grid-catalogo-productos');
            if (!grid) return;
            grid.innerHTML = '';

            const filtro = (document.getElementById('filtro-catalogo').value || '').trim().toUpperCase();

            // Filtrar productos por búsqueda y categoría
            const productosFiltrados = productosDB.filter(p => {
                const matchTexto = (p.nombre && p.nombre.toUpperCase().includes(filtro)) ||
                    (p.id && p.id.toUpperCase().includes(filtro));
                const matchCat = (catalogoCategoriaActiva === 'TODOS') || (p.categoria === catalogoCategoriaActiva);
                return matchTexto && matchCat;
            });

            if (productosFiltrados.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 50px 20px;">
                        <div style="font-size: 2.5rem; margin-bottom: 10px;">🔍</div>
                        <strong style="font-size: 1.1rem; color: var(--text-primary); display: block; margin-bottom: 6px;">No se encontraron productos</strong>
                        <p style="margin: 0; font-size: 0.9rem;">Probá buscando con otro nombre o seleccioná "Todos".</p>
                    </div>
                `;
                return;
            }

            // Ordenar alfabéticamente
            productosFiltrados.sort((a, b) => a.nombre.localeCompare(b.nombre));

            let html = '';
            productosFiltrados.forEach(p => {
                const esVariable = p.tipo === "variable";
                const precioNum = parseFloat(p.precio) || 0;
                const precioText = esVariable ? "Variable" : `$${precioNum.toLocaleString('es-AR')}`;
                const imgSrc = resolverRutaImagen(p.imagen);

                html += `
                <div class="tarjeta-producto" onclick="seleccionarProductoCatalogo('${p.id}')" title="Clic para agregar ${p.nombre}">
                    <div class="tarjeta-producto-thumb">
                        <img class="tarjeta-producto-img" 
                             src="${imgSrc}" 
                             alt="${p.nombre}" 
                             loading="lazy" 
                             onerror="handleImageFallback(this, '${p.imagen}')">
                    </div>
                    <div class="tarjeta-producto-body">
                        <h4 class="tarjeta-producto-titulo" title="${p.nombre}">${p.nombre}</h4>
                        <div class="tarjeta-producto-footer">
                            <span class="tarjeta-producto-precio">${precioText}</span>
                            <span class="tarjeta-producto-codigo">Cód: ${p.id}</span>
                        </div>
                    </div>
                </div>
                `;
            });
            grid.innerHTML = html;
        }

        function filtrarCatalogo() {
            renderizarCatalogo();
        }

        function seleccionarProductoCatalogo(codigo) {
            procesarEscaneo(codigo);
            cerrarModalCatalogo();
        }
    </script>
</body>

</html>
